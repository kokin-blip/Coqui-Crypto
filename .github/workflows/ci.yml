name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Boots the real Electron main process and drives one channel from the
  # renderer through the sandboxed preload. Everything above this job runs
  # inside vitest, where an Electron-only failure — a missing node:sqlite, a
  # preload that cannot be required under sandbox — is invisible.
  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron downloads its binary lazily. Configure the shipped helper before
      # launching Chromium so Ubuntu CI keeps sandboxing enabled.
      - name: Configure Electron sandbox helper on Linux
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          node -e "require('electron')"
          sandbox_helper="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"

      - name: Boot Electron and round-trip a channel
        if: runner.os != 'Linux'
        run: pnpm smoke

      - name: Boot Electron and round-trip a channel
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm smoke

      # Includes its own sensitivity control: a deliberately injected
      # renderer-blocking regression must breach the budget, or the harness
      # fails regardless of how good the baseline looks.
      - name: Measure renderer performance
        if: runner.os != 'Linux'
        run: pnpm perf

      - name: Measure renderer performance
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm perf

  native-dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load native keyring without accessing credentials
        run: pnpm --filter @coqui/adapters test:native-keyring

      - name: Load native DuckDB and execute an in-memory query
        run: pnpm --filter @coqui/storage test:native-duckdb

  # Reviewable installers use the release commands without tagging or publishing.
  packaged-smoke:
    if: github.event_name == 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: macos-arm64
          - os: windows-latest
            script: package:win
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coqui/desktop ${{ matrix.script }}
      - run: pnpm --filter @coqui/desktop smoke:packaged
      - name: Hash candidate artifacts
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cd apps/desktop/release
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const files = readdirSync('.').filter(file => /\.(dmg|zip|exe)$/i.test(file)).sort();
          if (!files.length) throw new Error('No candidate artifacts');
          const lines = files.map(file => `${createHash('sha256').update(readFileSync(file)).digest('hex')}  ${file}`);
          writeFileSync(`SHA256SUMS-${process.env.ARTIFACT}.txt`, `${lines.join('\n')}\n`);
          NODE
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: candidate-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
